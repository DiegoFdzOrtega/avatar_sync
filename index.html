<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interfaz natural: tu cara controla al personaje</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js" crossorigin="anonymous"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #100c22;
      color: #f2eefc;
      font-family: system-ui, sans-serif;
      text-align: center;
    }
    h1 { font-size: 24px; margin: 0 0 14px; }

    .paneles {
      display: flex;
      gap: 24px;
      justify-content: center;
      flex-wrap: wrap;
      max-width: 1100px;
      margin: 0 auto;
    }
    .panel { width: 480px; max-width: 95vw; }
    h2 { font-size: 15px; font-weight: normal; opacity: 0.75; margin: 0 0 8px; }

    .marco {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
    }
    video, #puntos {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    video { object-fit: cover; transform: scaleX(-1); }
    #puntos { transform: scaleX(-1); pointer-events: none; }

    #personaje {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 14px;
      background: radial-gradient(circle at 50% 40%, #3a2a6b, #120d26);
      display: block;
    }

    button {
      background: #7c4dff;
      color: #fff;
      border: 0;
      border-radius: 10px;
      padding: 11px 20px;
      font-size: 15px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }

    #estado {
      margin: 16px auto 4px;
      padding: 10px 14px;
      max-width: 1000px;
      background: #1b1538;
      border-radius: 10px;
      font-size: 14px;
    }
    #datos { font: 12px monospace; opacity: 0.6; margin: 0 0 16px; }

    .ajustes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px 24px;
      max-width: 1000px;
      margin: 0 auto;
      text-align: left;
      background: #1b1538;
      padding: 16px 20px;
      border-radius: 12px;
    }
    .ajustes label { display: block; font-size: 14px; }
    .ajustes input[type=range] { width: 100%; }
    .ajustes .casilla { display: flex; align-items: center; gap: 8px; }
    .ajustes .boton-fila { grid-column: 1 / -1; text-align: center; }
  </style>
</head>
<body>
  <h1>Interfaz natural: tu cara controla al personaje</h1>
  <button id="btn" disabled>Iniciar cámara</button>

  <div class="paneles" style="margin-top:16px">
    <section class="panel">
      <h2>Tu cara</h2>
      <div class="marco">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="puntos"></canvas>
      </div>
    </section>

    <section class="panel">
      <h2>Personaje</h2>
      <canvas id="personaje" width="512" height="512"></canvas>
    </section>
  </div>

  <p id="estado">Cargando...</p>
  <p id="datos"></p>

  <div class="ajustes">
    <label>Giro lateral: <b id="vG"></b>
      <input id="sG" type="range" min="0" max="20" step="0.5"></label>
    <label>Bajar la cabeza: <b id="vA"></b>
      <input id="sA" type="range" min="0" max="40" step="0.5"></label>
    <label>Subir la cabeza: <b id="vU"></b>
      <input id="sU" type="range" min="0" max="80" step="0.5"></label>
    <label class="casilla"><input id="iV" type="checkbox" checked> Invertir subir y bajar</label>
    <label>Zona muerta lateral: <b id="vZG"></b>
      <input id="sZG" type="range" min="0" max="0.2" step="0.005"></label>
    <label>Zona muerta vertical: <b id="vZV"></b>
      <input id="sZV" type="range" min="0" max="0.2" step="0.005"></label>
    <label>Umbral de voz: <b id="vS"></b>
      <input id="sS" type="range" min="0.0005" max="0.05" step="0.0005"></label>
    <div class="boton-fila">
      <button id="btnCal">Calibrar (mírate de frente 2 s)</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
